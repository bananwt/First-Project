<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Expense Tracker</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="bg-light">

  <!-- Navbar -->
  <nav class="navbar navbar-dark bg-dark mb-4 shadow-sm">
    <div class="container">
      <span class="navbar-brand fw-bold mb-0">Expense Tracker</span>
    </div>
  </nav>

  <div class="container mb-5">
    <div id="alertBox" class="alert alert-danger d-none mb-4" role="alert"></div>

    <!-- Summary Cards -->
    <div class="summary-grid mb-4">
      <div class="card shadow-sm border-0 text-center py-4 px-3 h-100">
        <div class="card-body">
          <h5 class="text-muted small">Total</h5>
          <h2 class="fw-bold mt-2 mb-0" id="totalAmount">$0.00</h2>
        </div>
      </div>
    
      <div class="card shadow-sm border-0 text-center py-4 px-3 h-100">
        <div class="card-body">
          <h5 class="text-muted small">Number of Expenses</h5>
          <h2 class="fw-bold mt-2 mb-0" id="totalCount">0</h2>
        </div>
      </div>
    
      <div class="card shadow-sm border-0 text-center py-4 px-3 h-100">
        <div class="card-body">
          <h5 class="text-muted small">Highest Expense</h5>
          <h2 class="fw-bold mt-2 mb-1" id="highestExpenseAmount">$0.00</h2>
          <span class="text-muted small" id="highestExpenseTitle">-</span>
        </div>
      </div>
    </div>

    <!-- Add Expense Form Card -->
    <div class="card shadow-sm border-0 p-4 mb-4">
      <div class="card-body">
        <h5 class="card-title fw-bold mb-3">Add Expense</h5>
        <form id="addExpenseForm" novalidate>
          <div class="row g-3">
            <div class="col-md-3">
              <label for="addTitle" class="form-label text-muted small">Title</label>
              <input type="text" class="form-control" id="addTitle" placeholder="Groceries" required>
              <div class="invalid-feedback">Title is required.</div>
            </div>
            <div class="col-md-3">
              <label for="addAmount" class="form-label text-muted small">Amount</label>
              <input type="number" step="0.01" min="0.01" class="form-control" id="addAmount" placeholder="0.00" required>
              <div class="invalid-feedback">Enter an amount greater than 0.</div>
            </div>
            <div class="col-md-3">
              <label for="addCategory" class="form-label text-muted small">Category</label>
              <select id="addCategory" class="form-select" required>
                <option value="" selected disabled>Choose...</option>
                <option value="Food">Food</option>
                <option value="Transport">Transport</option>
                <option value="Bills">Bills</option>
                <option value="Entertainment">Entertainment</option>
                <option value="Other">Other</option>
              </select>
              <div class="invalid-feedback">Choose a category.</div>
            </div>
            <div class="col-md-3">
              <label for="addDate" class="form-label text-muted small">Date</label>
              <input type="date" class="form-control" id="addDate" required>
              <div class="invalid-feedback">Date is required.</div>
            </div>
          </div>
          <div class="mt-3">
            <button type="submit" class="btn btn-primary">Add Expense</button>
          </div>
        </form>
      </div>
    </div>

    <!-- Expense List Card -->
    <div class="card shadow-sm border-0 p-4">
      <div class="d-flex justify-content-between align-items-center mb-3">
        <h5 class="fw-bold mb-0">Expenses</h5>
        <div class="d-flex align-items-center gap-2">
          <!-- Bonus: Search Input -->
          <input type="text" id="searchInput" class="form-control form-control-sm" placeholder="Search title..." style="width: 160px;">
          <label for="categoryFilter" class="small text-muted mb-0">Category</label>
          <select id="categoryFilter" class="form-select form-select-sm" style="width: auto;">
            <option value="All" selected>All</option>
            <option value="Food">Food</option>
            <option value="Transport">Transport</option>
            <option value="Bills">Bills</option>
            <option value="Entertainment">Entertainment</option>
            <option value="Other">Other</option>
          </select>
          <!-- Bonus: Export to CSV -->
    <button id="exportCsvBtn" class="btn btn-sm btn-outline-success">Export CSV</button>
        </div>
      </div>

      <div id="spinner" class="spinner-border text-primary d-block mx-auto my-4" role="status"></div>

      <div class="table-responsive">
        <table class="table align-middle" id="expenseTable">
          <thead class="table-light">
            <tr>
              <th>Title</th>
              <th>Amount</th>
              <th>Category</th>
              <th>Date</th>
              <th class="text-end">Actions</th>
            </tr>
          </thead>
          <tbody id="expensesTableBody"></tbody>
        </table>
      </div>
    </div>
  </div>

  <!-- Edit Expense Modal -->
  <div class="modal fade" id="editModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog">
      <div class="modal-content">
        <form id="editExpenseForm" novalidate>
          <div class="modal-header">
            <h5 class="modal-title fw-bold">Edit Expense</h5>
            <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
          </div>
          <div class="modal-body">
            <input type="hidden" id="editId" />
            <div class="mb-3">
              <label for="editTitle" class="form-label text-muted small">Title</label>
              <input type="text" class="form-control" id="editTitle" required />
            </div>
            <div class="mb-3">
              <label for="editAmount" class="form-label text-muted small">Amount</label>
              <input type="number" step="0.01" min="0.01" class="form-control" id="editAmount" required />
            </div>
            <div class="mb-3">
              <label for="editCategory" class="form-label text-muted small">Category</label>
              <select class="form-select" id="editCategory" required>
                <option value="Food">Food</option>
                <option value="Transport">Transport</option>
                <option value="Bills">Bills</option>
                <option value="Entertainment">Entertainment</option>
                <option value="Other">Other</option>
              </select>
            </div>
            <div class="mb-3">
              <label for="editDate" class="form-label text-muted small">Date</label>
              <input type="date" class="form-control" id="editDate" required />
            </div>
          </div>
          <div class="modal-footer">
            <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
            <button type="submit" class="btn btn-primary">Save changes</button>
          </div>
        </form>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
